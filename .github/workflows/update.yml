name: Update IPTV Assets

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Generate playlist.m3u and logos.json
        run: node generate.js
        working-directory: scripts

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u logos.json
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update IPTV assets $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr cacheia ficheiros servidos via @branch por até 7 dias.
      # Sem este purge, o Pixgo continuaria a servir playlist.m3u/logos.json
      # desatualizados até o cache expirar sozinho. Só roda se houve push
      # (não faz sentido purgar quando nada mudou). A API de purge é pública
      # e gratuita — não exige token.
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/playlist.m3u"
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/logos.json"
